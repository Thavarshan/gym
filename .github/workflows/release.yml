name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        shell: bash
        run: |
          tag='${{ github.event.inputs.tag || github.ref_name }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$tag" >/dev/null
          echo "value=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package (${{ matrix.platform }})
    needs: validate-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-latest
            triplet: x64-linux
          - platform: macos-arm64
            runner: macos-14
            triplet: arm64-osx
          - platform: windows-x64
            runner: windows-latest
            triplet: x64-windows-static
    uses: ./.github/workflows/build-test.yml
    with:
      runner: ${{ matrix.runner }}
      triplet: ${{ matrix.triplet }}
      build_type: Release
      package: true
      artifact_name: gym-cli-${{ matrix.platform }}
      ref: ${{ needs.validate-tag.outputs.tag }}

  publish:
    name: Attest and publish
    needs: [validate-tag, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v4
        with:
          pattern: gym-cli-*
          path: dist
          merge-multiple: true
      - name: Verify packages and generate checksums
        shell: bash
        run: |
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print | sort | tee package-list.txt
          test -s package-list.txt
          while IFS= read -r package; do
            case "$package" in
              *.zip) unzip -t "$package" >/dev/null ;;
              *.tar.gz) tar -tzf "$package" >/dev/null ;;
            esac
          done < package-list.txt
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS
          test -s dist/SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@d7200a720eed41adabe049cd48f7e13cd52bf858 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/gym-cli-${{ needs.validate-tag.outputs.tag }}.spdx.json
      - name: Attest release materials
        uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4 # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@5a6f51711ce2ba103b78f5e9550f810679f11e0e # v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/*.spdx.json
