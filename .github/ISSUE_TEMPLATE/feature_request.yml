name: Feature request
description: Propose a focused improvement to Gym CLI.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: For broad ideas, start a Discussion first so the community can shape the proposal.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
